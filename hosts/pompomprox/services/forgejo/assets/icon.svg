<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="iridescent" x1="0%" x2="100%" y1="0%" y2="0%" gradientTransform="rotate(20)"
      gradientUnits="userSpaceOnUse" spreadMethod="reflect">
      <stop offset="0%" stop-color="#f38ba8ff">
        <animate attributeName="stop-color" dur="3s" repeatCount="indefinite"
          values="#F38BA8FF; #A6E3A1FF; #B4BEFEFF; #F38BA8FF" />
      </stop>
      <stop offset="50%" stop-color="#f9e2afff">
