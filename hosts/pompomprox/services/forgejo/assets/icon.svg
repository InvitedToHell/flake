    </linearGradient>
    <filter id="bloom">
      <feGaussianBlur stdDeviation=".1" />
      <feComponentTransfer>
        <feFuncR type="identity" />
        <feFuncG type="identity" />
        <feFuncB type="identity" />
        <feFuncA type="identity" />
      </feComponentTransfer>
      <feMerge>
